name: content-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Every commit this event makes public must carry a GitHub noreply address.
  # Judged by the core, called from main; pushes to branches without a pull
  # request and to tags go through noreply-identity.yml.
  noreply-identity:
    uses: oss-invisible/core/.github/workflows/noreply-identity.yml@main

  gate:
    needs: noreply-identity
    # A job whose needs failed is skipped, and a skipped required check counts
    # as green: always() makes it run, and the first step refuses.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: the noreply identity check passed
        run: |
          echo "noreply-identity: ${{ needs.noreply-identity.result }}"
          if [ "${{ needs.noreply-identity.result }}" != "success" ]; then
            echo "a commit or tag carries an address that is not a GitHub noreply one"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate proves itself on known-bad input before it judges anything.
      - name: Gate selftest
        run: python scripts/check_content.py --selftest
      - name: Content gates
        run: python scripts/check_content.py
      # A README that promises to beat everything is refused here: an absolute,
      # a circumvention word and a protection word in one sentence. The logic is
      # `invisible_core.claims` since core 34.29.0, shared with the wrapper, and
      # it sits in THIS job because `gate` is the context branch protection
      # requires. A circumvention claim on its own stays allowed and is only
      # reported. What it reads is the README, which is also what PyPI shows.
      - name: The README promises nothing it cannot support
        run: |
          python -m pip install --upgrade pip "invisible-core>=34.29.0"
          python -m invisible_core.claims --selftest
          python -m invisible_core.claims
      - name: Wiki renders end to end
        run: |
          python scripts/build_wiki.py docs /tmp/wiki-out
          test -f /tmp/wiki-out/_Sidebar.md
          test -f /tmp/wiki-out/Home.md
